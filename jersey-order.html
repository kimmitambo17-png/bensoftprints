<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bensoft Prints - Authentic Football Kit Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary-color: #218838;
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --text-light: #ffffff;
            --text-gray: #aaaaaa;
            
            /* 3D Dynamic Kit Engine Variable Maps */
            --jersey-body: #ef0107; 
            --jersey-sleeves: #ffffff;
            --jersey-trim: #ffffff;
            --jersey-text: #ffffff;
            --stripe-display: block; /* Toggles kit details like stripes dynamically */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }

        /* Clean Studio Photographic Preview Box */
        .preview-box {
            background: #161616;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 520px;
            border: 1px solid #252525;
            overflow: hidden;
        }

        /* --- ADVANCED STRUCTURAL CSS JERSEY ENGINE (NO EXTERNAL DATA DEPENDENCIES) --- */
        .jersey-container {
            position: relative;
            width: 300px;
            height: 340px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            margin-top: 20px;
            perspective: 800px;
        }

        /* The main torso structure */
        .jersey-body-panel {
            position: relative;
            width: 170px;
            height: 250px;
            background-color: var(--jersey-body);
            border-radius: 4px 4px 10px 10px;
            box-shadow: inset 0 25px 30px rgba(0,0,0,0.15), inset 0 -15px 20px rgba(0,0,0,0.2), 0 15px 35px rgba(0,0,0,0.4);
            z-index: 3;
            transition: background-color 0.4s ease;
            overflow: hidden;
        }

        /* Dynamic Kit Brand Design Details (e.g., Vertical Center Panels / Stripes) */
        .jersey-stripes-overlay {
            display: var(--stripe-display);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Emulates high-end fabric stripes/textures natively */
            background: linear-gradient(90deg, 
                rgba(255,255,255,0.15) 10%, transparent 10%, 
                transparent 45%, rgba(255,255,255,0.15) 45%, 
                rgba(255,255,255,0.15) 55%, transparent 55%, 
                transparent 90%, rgba(255,255,255,0.15) 90%);
            pointer-events: none;
            z-index: 4;
        }

        /* Athletic Crew Neck Collar */
        .jersey-collar-patch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 76px;
            height: 24px;
            background-color: var(--jersey-trim);
            border-radius: 0 0 35px 35px;
            z-index: 5;
            box-shadow: inset 0 -3px 5px rgba(0,0,0,0.2);
            transition: background-color 0.4s ease;
        }
        
        .jersey-collar-inner {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 16px;
            background-color: #161616;
            border-radius: 0 0 30px 30px;
            z-index: 6;
        }

        /* Left Sleeve Panel Construction */
        .sleeve-left {
            position: absolute;
            top: 0;
            right: 154px; 
            width: 60px;
            height: 110px;
            background-color: var(--jersey-sleeves);
            border-radius: 6px 0 0 12px;
            transform-origin: top right;
            transform: rotate(28deg);
            z-index: 2;
            box-shadow: inset 15px 10px 15px rgba(0,0,0,0.15), -5px 10px 15px rgba(0,0,0,0.2);
            border-bottom: 8px solid var(--jersey-trim);
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }

        /* Right Sleeve Panel Construction */
        .sleeve-right {
            position: absolute;
            top: 0;
            left: 154px;
            width: 60px;
            height: 110px;
            background-color: var(--jersey-sleeves);
            border-radius: 0 6px 12px 0;
            transform-origin: top left;
            transform: rotate(-28deg);
            z-index: 2;
            box-shadow: inset -15px 10px 15px rgba(0,0,0,0.15), 5px 10px 15px rgba(0,0,0,0.2);
            border-bottom: 8px solid var(--jersey-trim);
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }

        /* Subdued Fabric Realism Shadow Overlay Mapping */
        .fabric-shading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, rgba(0,0,0,0.1) 0%, rgba(255,255,255,0.08) 50%, rgba(0,0,0,0.18) 100%);
            pointer-events: none;
            z-index: 5;
        }

        /* Precise alignment layer for vinyl print elements */
        .jersey-printing {
            position: absolute;
            top: 45px; 
            left: 0;
            width: 100%;
            text-align: center;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .jersey-name-display {
            font-size: 1.2rem;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--jersey-text);
            letter-spacing: 3px;
            font-family: 'Impact', Arial Black, sans-serif; 
            max-width: 85%;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
            transition: color 0.3s ease, font-family 0.2s ease;
        }

        .jersey-number-display {
            font-size: 5.5rem;
            font-weight: 900;
            font-family: 'Impact', Arial Black, sans-serif;
            color: var(--jersey-text);
            line-height: 1;
            margin-top: 10px;
            text-shadow: 0 3px 6px rgba(0,0,0,0.7);
            transition: color 0.3s ease, font-family 0.2s ease;
        }

        /* Form Layout Options Panel */
        .form-box {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            border: 1px solid #333;
        }

        h2 { margin-top: 0; color: var(--text-light); font-size: 1.6rem; border-bottom: 2px solid var(--primary-color); padding-bottom: 8px;}
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: var(--text-gray); font-size: 0.9rem; }
        
        input[type="text"], input[type="tel"], select, input[type="number"] {
            width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; box-sizing: border-box; font-size: 1rem;
        }

        .type-toggle { display: flex; gap: 10px; margin-bottom: 20px; }
        .toggle-btn { flex: 1; padding: 12px; background: #2a2a2a; border: 1px solid #444; color: #aaa; text-align: center; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
        .toggle-btn.active { background: #fff; color: #111; border-color: #fff; }

        .conditional-section { background: #252525; padding: 15px; border-radius: 8px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; }
        .editor-section { background: #1a2a1a; padding: 15px; border-radius: 8px; border-left: 4px solid #ffeb3b; margin-bottom: 20px; }

        .color-pickers { display: flex; gap: 10px; margin-top: 5px; }
        .color-dot { width: 35px; height: 35px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .color-dot.active { border-color: #fff; transform: scale(1.1); }

        .submit-order-btn {
            width: 100%; background: var(--primary-color); color: white; padding: 14px; border: none; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 10px;
        }
        .submit-order-btn:hover { background: #1e7e34; }
    </style>
</head>
<body>

<div id="mpesa-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center;">
    <div style="background: #1e1e1e; color: #fff; width: 320px; border-radius: 12px; padding: 20px; box-shadow: 0 5px 25px rgba(0,0,0,0.5); border: 2px solid #4ca64c;">
        <div style="text-align: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px;">
            <span style="color: #4ca64c; font-weight: bold; font-size: 1.2rem;">LIPA NA M-PESA</span>
        </div>
        <div style="font-size: 0.95rem; line-height: 1.6; margin-bottom: 20px;">
            <p style="margin: 5px 0;"><strong>Pay Bill / Till:</strong> Bensoft Prints</p>
            <p style="margin: 5px 0;"><strong>Amount:</strong> KSh 400.00</p>
            <p style="margin: 5px 0;"><strong>Account:</strong> <span id="mpesa-phone-display">07XXXXXXXX</span></p>
            <hr style="border: 0; border-top: 1px dashed #444; margin: 15px 0;">
            <p style="text-align: center; color: #aaa; font-style: italic; font-size: 0.85rem;">[STK PUSH SIMULATION ACTIVE]</p>
        </div>
        <div style="text-align: center; color: #4ca64c; font-weight: bold; font-size: 0.9rem;" id="mpesa-status-text">
            Initializing STK Push...
        </div>
    </div>
</div>

<div class="container">
    <div class="preview-box" id="capture-zone">
        <div class="jersey-container">
            <div class="sleeve-left"></div>
            
            <div class="jersey-body-panel">
                <div class="jersey-collar-patch">
                    <div class="jersey-collar-inner"></div>
                </div>
                <div class="jersey-stripes-overlay"></div>
                <div class="fabric-shading-overlay"></div>
                
                <div class="jersey-printing">
                    <div class="jersey-name-display" id="preview-name-txt">YOUR NAME</div>
                    <div class="jersey-number-display" id="preview-number-txt">7</div>
                </div>
            </div>
            
            <div class="sleeve-right"></div>
        </div>
        <p style="color: var(--text-gray); font-size: 0.85rem; margin-top: 25px; font-style: italic;">3D Engineered Customizer Canvas</p>
    </div>

    <div class="form-box">
        <h2>Match Day Kit Customizer</h2>
        
        <form id="jerseyOrderForm" action="https://formspree.io/f/xvggpzel" method="POST">
            
            <div class="form-group">
                <label>Select Customisation Mode</label>
                <div class="type-toggle">
                    <div class="toggle-btn" id="btn-track-plain" onclick="switchTrack('plain')">Plain / Custom Base</div>
                    <div class="toggle-btn active" id="btn-track-team" onclick="switchTrack('team')">Official Club Kit Layout</div>
                </div>
                <input type="hidden" name="Kit Track Category" id="kit-track-input" value="team">
            </div>

            <div id="section-track-plain" class="conditional-section" style="display: none;">
                <div class="form-group">
                    <label>Choose Fabric Base Color</label>
                    <div class="color-pickers">
                        <div class="color-dot active" style="background: #034694;" onclick="changeCustomColors('#034694', '#034694', '#ffffff', '#ffffff', 'none', this)"></div>
                        <div class="color-dot" style="background: #cc0000;" onclick="changeCustomColors('#cc0000', '#cc0000', '#ffffff', '#ffffff', 'none', this)"></div>
                        <div class="color-dot" style="background: #ffd700;" onclick="changeCustomColors('#ffd700', '#ffd700', '#111111', '#111111', 'none', this)"></div>
                        <div class="color-dot" style="background: #ffffff;" onclick="changeCustomColors('#ffffff', '#ffffff', '#111111', '#111111', 'none', this)"></div>
                        <div class="color-dot" style="background: #111111;" onclick="changeCustomColors('#111111', '#111111', '#ffffff', '#ffffff', 'none', this)"></div>
                    </div>
                </div>
            </div>

            <div id="section-track-team" class="conditional-section">
                <div class="form-group">
                    <label>Choose Tournament League / Category</label>
                    <select id="league-select" name="Target League" onchange="updateTeamDropdown()">
                        <option value="Premier League">Premier League</option>
                        <option value="LaLiga">LaLiga</option>
                        <option value="Bundesliga">Bundesliga</option>
                        <option value="Serie A">Serie A</option>
                        <option value="World Cup Nationals">World Cup Nationals</option>
                    </select>
                </div>

                <div class="form-group" id="group-team-select">
                    <label>Select Club / Squad Team</label>
                    <select id="team-select" name="Selected Team" onchange="applyTeamKitColors()">
                        </select>
                </div>

                <div class="form-group" id="group-kit-edition">
                    <label>Select Kit Edition Variant</label>
                    <select id="kit-edition-select" name="Kit Edition Variant" onchange="applyTeamKitColors()">
                        <option value="Home Kit">Home Kit</option>
                        <option value="Away Kit">Away Kit</option>
                        <option value="3rd Kit">3rd Kit</option>
                    </select>
                </div>
            </div>

            <div class="editor-section">
                <label style="color: #ffeb3b; font-weight: bold; margin-bottom: 10px; display: block;">Back-Print Customisation</label>
                
                <div class="form-group">
                    <label>Custom Name (Max 14 characters)</label>
                    <input type="text" id="input-back-name" name="Custom Print Name" placeholder="e.g. KEVIN" maxlength="14" oninput="updateJerseyName(this.value)">
                </div>

                <div class="form-group">
                    <label>Squad Number (0 - 99)</label>
                    <input type="number" id="input-back-number" name="Custom Print Number" value="7" min="0" max="99" oninput="updateJerseyNumber(this.value)">
                </div>

                <div class="form-group">
                    <label>Select Font Style Profile</label>
                    <select id="font-style-select" name="Custom Font Style" onchange="changeJerseyFont(this.value)">
                        <option value="'Impact', Arial Black, sans-serif">Bold Premium Athletic (Impact)</option>
                        <option value="'Courier New', Courier, monospace">Classic Retro Block (Courier)</option>
                        <option value="'Segoe UI', Tahoma, sans-serif">Modern Streamlined (Segoe UI)</option>
                    </select>
                </div>
            </div>

            <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">

            <div class="form-group">
                <label>Your Full Name</label>
                <input type="text" name="Client Name" required placeholder="e.g. Mitambo Kelvin">
            </div>

            <div class="form-group">
                <label>M-Pesa Mobile Number</label>
                <input type="tel" id="cust-phone" name="Client Phone" required placeholder="e.g. 0712345678">
            </div>

            <div class="form-group">
                <label>Total Secure Price</label>
                <input type="text" value="KSh 400.00" disabled style="font-weight: bold; color: #4ca64c; background: #1a1a1a;">
            </div>

            <button type="submit" class="submit-order-btn">Forward Configured Jersey Order</button>
        </form>
    </div>
</div>

<script>
    // Complete League Rosters Databank 
    const leagueData = {
        "Premier League": ["Arsenal", "Chelsea", "Liverpool", "Manchester City", "Manchester United", "Newcastle United", "Tottenham Hotspur", "West Ham United", "Aston Villa", "Everton"],
        "LaLiga": ["Real Madrid", "Barcelona", "Atletico Madrid", "Girona", "Real Sociedad", "Sevilla", "Valencia", "Athletic Bilbao"],
        "Bundesliga": ["Bayer Leverkusen", "Bayern Munich", "Borussia Dortmund", "RB Leipzig", "VfB Stuttgart", "Eintracht Frankfurt"],
        "Serie A": ["Inter Milan", "Juventus", "AC Milan", "Napoli", "AS Roma", "Lazio", "Atalanta"],
        "World Cup Nationals": ["Argentina", "Brazil", "France", "England", "Germany", "Portugal", "Spain", "Kenya (Harambee Stars)"]
    };

    // Robust 5-Value Structural Layout Engine Settings
    const teamKitColors = {
        "Arsenal": {
            "Home Kit": { body: "#ef0107", sleeves: "#ffffff", trim: "#ffffff", font: "#ffffff", stripes: "none" },
            "Away Kit": { body: "#111111", sleeves: "#111111", trim: "#ffeb3b", font: "#ffeb3b", stripes: "block" },
            "3rd Kit": { body: "#aaf0d1", sleeves: "#aaf0d1", trim: "#063672", font: "#063672", stripes: "none" }
        },
        "Chelsea": {
            "Home Kit": { body: "#034694", sleeves: "#034694", trim: "#ffffff", font: "#ffffff", stripes: "none" },
            "Away Kit": { body: "#f5f5f5", sleeves: "#f5f5f5", trim: "#034694", font: "#034694", stripes: "none" },
            "3rd Kit": { body: "#111111", sleeves: "#111111", trim: "#ec589a", font: "#ec589a", stripes: "block" }
        },
        "Manchester United": {
            "Home Kit": { body: "#da291c", sleeves: "#da291c", trim: "#ffffff", font: "#ffffff", stripes: "none" },
            "Away Kit": { body: "#22332c", sleeves: "#22332c", trim: "#ffffff", font: "#ffffff", stripes: "block" },
            "3rd Kit": { body: "#ffffff", sleeves: "#ffffff", trim: "#da291c", font: "#da291c", stripes: "none" }
        },
        "Liverpool": {
            "Home Kit": { body: "#c8102e", sleeves: "#c8102e", trim: "#ffd700", font: "#ffd700", stripes: "none" },
            "Away Kit": { body: "#ffffff", sleeves: "#ffffff", trim: "#00b2a9", font: "#1c2321", stripes: "none" },
            "3rd Kit": { body: "#1c2321", sleeves: "#1c2321", trim: "#ffffff", font: "#ffffff", stripes: "none" }
        },
        "Manchester City": {
            "Home Kit": { body: "#6cabdd", sleeves: "#6cabdd", trim: "#ffffff", font: "#ffffff", stripes: "none" },
            "Away Kit": { body: "#1c2c5b", sleeves: "#1c2c5b", trim: "#ffeb3b", font: "#ffeb3b", stripes: "block" },
            "3rd Kit": { body: "#333333", sleeves: "#333333", trim: "#6cabdd", font: "#6cabdd", stripes: "none" }
        },
        "Real Madrid": {
            "Home Kit": { body: "#ffffff", sleeves: "#ffffff", trim: "#111111", font: "#111111", stripes: "none" },
            "Away Kit": { body: "#ffb6c1", sleeves: "#ffb6c1", trim: "#ffffff", font: "#ffffff", stripes: "none" },
            "3rd Kit": { body: "#1c2430", sleeves: "#1c2430", trim: "#ffd700", font: "#ffd700", stripes: "block" }
        },
        "Barcelona": {
            "Home Kit": { body: "#004d98", sleeves: "#a50044", trim: "#ffd700", font: "#ffd700", stripes: "block" },
            "Away Kit": { body: "#111111", sleeves: "#111111", trim: "#004d98", font: "#ffd700", stripes: "none" },
            "3rd Kit": { body: "#a50044", sleeves: "#004d98", trim: "#ffffff", font: "#ffffff", stripes: "block" }
        },
        "Bayern Munich": {
            "Home Kit": { body: "#dc052d", sleeves: "#ffffff", trim: "#ffffff", font: "#ffffff", stripes: "none" },
            "Away Kit": { body: "#111111", sleeves: "#111111", trim: "#1c2c5b", font: "#ffffff", stripes: "none" },
            "3rd Kit": { body: "#ffffff", sleeves: "#ffffff", trim: "#dc052d", font: "#dc052d", stripes: "none" }
        },
        "Borussia Dortmund": {
            "Home Kit": { body: "#fde100", sleeves: "#111111", trim: "#111111", font: "#111111", stripes: "block" },
            "Away Kit": { body: "#111111", sleeves: "#111111", trim: "#fde100", font: "#fde100", stripes: "none" },
            "3rd Kit": { body: "#ffffff", sleeves: "#ffffff", trim: "#fde100", font: "#111111", stripes: "none" }
        },
        "Inter Milan": {
            "Home Kit": { body: "#004d98", sleeves: "#111111", trim: "#ffffff", font: "#ffffff", stripes: "block" },
            "Away Kit": { body: "#ffffff", sleeves: "#004d98", trim: "#111111", font: "#111111", stripes: "none" },
            "3rd Kit": { body: "#ffeb3b", sleeves: "#ffeb3b", trim: "#111111", font: "#111111", stripes: "block" }
        },
        "Juventus": {
            "Home Kit": { body: "#111111", sleeves: "#ffffff", trim: "#ffd700", font: "#ffd700", stripes: "block" },
            "Away Kit": { body: "#ffd700", sleeves: "#ffd700", trim: "#111111", font: "#111111", stripes: "none" },
            "3rd Kit": { body: "#1c1c1c", sleeves: "#1c1c1c", trim: "#ffffff", font: "#ffffff", stripes: "none" }
        },
        "Kenya (Harambee Stars)": {
            "Home Kit": { body: "#cc0000", sleeves: "#cc0000", trim: "#ffffff", font: "#ffffff", stripes: "none" },
            "Away Kit": { body: "#ffffff", sleeves: "#ffffff", trim: "#cc0000", font: "#cc0000", stripes: "none" },
            "3rd Kit": { body: "#228b22", sleeves: "#228b22", trim: "#ffffff", font: "#ffffff", stripes: "none" }
        }
    };

    function switchTrack(track) {
        document.getElementById('kit-track-input').value = track;
        document.getElementById('btn-track-plain').classList.toggle('active', track === 'plain');
        document.getElementById('btn-track-team').classList.toggle('active', track === 'team');

        if (track === 'plain') {
            document.getElementById('section-track-plain').style.display = 'block';
            document.getElementById('section-track-team').style.display = 'none';
            applyTeamKitColors();
        } else {
            document.getElementById('section-track-plain').style.display = 'none';
            document.getElementById('section-track-team').style.display = 'block';
            updateTeamDropdown();
        }
    }

    function updateTeamDropdown() {
        const selectedLeague = document.getElementById('league-select').value;
        const teamSelect = document.getElementById('team-select');

        teamSelect.innerHTML = "";
        leagueData[selectedLeague].forEach(team => {
            let opt = document.createElement('option');
            opt.value = team;
            opt.innerText = team;
            teamSelect.appendChild(opt);
        });

        applyTeamKitColors();
    }

    function applyTeamKitColors() {
        const track = document.getElementById('kit-track-input').value;
        
        if (track === 'plain') {
            updateVisualEngine("#034694", "#034694", "#ffffff", "#ffffff", "none");
            return;
        }

        const currentSelectedTeam = document.getElementById('team-select').value;
        const currentEdition = document.getElementById('kit-edition-select').value;

        if (teamKitColors[currentSelectedTeam] && teamKitColors[currentSelectedTeam][currentEdition]) {
            const cfg = teamKitColors[currentSelectedTeam][currentEdition];
            updateVisualEngine(cfg.body, cfg.sleeves, cfg.trim, cfg.font, cfg.stripes);
        } else {
            updateVisualEngine("#252525", "#252525", "#ffffff", "#ffffff", "none");
        }
    }

    function changeCustomColors(body, sleeves, trim, font, stripes, element) {
        document.querySelectorAll('.color-pickers .color-dot').forEach(dot => dot.classList.remove('active'));
        element.classList.add('active');
        updateVisualEngine(body, sleeves, trim, font, stripes);
    }

    function updateVisualEngine(body, sleeves, trim, font, stripes) {
        document.documentElement.style.setProperty('--jersey-body', body);
        document.documentElement.style.setProperty('--jersey-sleeves', sleeves);
        document.documentElement.style.setProperty('--jersey-trim', trim);
        document.documentElement.style.setProperty('--jersey-text', font);
        document.documentElement.style.setProperty('--stripe-display', stripes);
    }

    function updateJerseyName(val) {
        document.getElementById('preview-name-txt').innerText = val.trim().toUpperCase() || "YOUR NAME";
    }

    function updateJerseyNumber(val) {
        document.getElementById('preview-number-txt').innerText = val || "7";
    }

    function changeJerseyFont(fontFamilyString) {
        document.getElementById('preview-name-txt').style.fontFamily = fontFamilyString;
        document.getElementById('preview-number-txt').style.fontFamily = fontFamilyString;
    }

    // Initialize default values seamlessly on load
    window.onload = function() {
        updateTeamDropdown();
    };

    // --- AUTOMATED SECURE SUBMISSION PIPELINE ---
    document.getElementById('jerseyOrderForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const form = this;
        const customerPhone = document.getElementById('cust-phone').value;
        const captureZone = document.getElementById('capture-zone');
        const mpesaModal = document.getElementById('mpesa-modal');
        
        document.getElementById('mpesa-phone-display').innerText = customerPhone || "Your Phone";
        mpesaModal.style.display = 'flex';

        setTimeout(() => {
            document.getElementById('mpesa-status-text').innerText = "STK Prompt Sent! Confirm payment on phone...";
            document.getElementById('mpesa-status-text').style.color = "#ffeb3b";
        }, 2000);

        html2canvas(captureZone, { logging: false, backgroundColor: '#161616' }).then(canvas => {
            canvas.toBlob(function(blob) {
                const file = new File([blob], "jersey-3d-preview.png", { type: "image/png" });
                const dataTransfer = new DataTransfer();
                dataTransfer.items.add(file);
                
                let hiddenFileInput = document.getElementById('logo-upload-hidden');
                if(!hiddenFileInput) {
                    hiddenFileInput = document.createElement('input');
                    hiddenFileInput.type = 'file';
                    hiddenFileInput.id = 'logo-upload-hidden';
                    hiddenFileInput.name = 'Structural Render Capture';
                    hiddenFileInput.style.display = 'none';
                    form.appendChild(hiddenFileInput);
                }
                hiddenFileInput.files = dataTransfer.files;
                
                finishOrder();
            }, 'image/png');
        });

        function finishOrder() {
            setTimeout(() => {
                document.getElementById('mpesa-status-text').innerText = "Payment Verified! Sending Layout Profile...";
                document.getElementById('mpesa-status-text').style.color = "#28a745";
                
                setTimeout(() => {
                    mpesaModal.style.display = 'none';
                    
                    const formData = new FormData(form);
                    const submitBtn = form.querySelector('.submit-order-btn');
                    submitBtn.innerText = "Transmitting Layout Data...";
                    submitBtn.disabled = true;

                    fetch(form.action, {
                        method: form.method,
                        body: formData,
                        headers: { 'Accept': 'application/json' }
                    })
                    .then(response => {
                        if (response.ok) {
                            form.reset();
                            switchTrack('team');
                            document.getElementById('input-back-name').value = "";
                            updateJerseyName("");
                            updateJerseyNumber("7");
                            alert("🎉 Custom Jersey Order Sent Successfully!\n\nYour 3D mockup structural render screenshot and payment details have been logged. The production team will be in touch shortly.");
                        } else {
                            alert("Submission processing error. Please try again.");
                        }
                    })
                    .catch(error => {
                        alert("Network connectivity issue. Please check your connection.");
                    })
                    .finally(() => {
                        submitBtn.innerText = "Forward Configured Jersey Order";
                        submitBtn.disabled = false;
                    });
                }, 1500);
            }, 6000); 
        }
    });
</script>
</body>
